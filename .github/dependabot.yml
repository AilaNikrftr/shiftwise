# Weekly dependency update PRs, grouped so they don't flood the repo.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      nuget: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
