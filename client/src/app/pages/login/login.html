<section class="auth-card">
  <h1>Sign in</h1>

  <form (ngSubmit)="submit()" #form="ngForm">
    <label>
      Email
      <input type="email" name="email" [(ngModel)]="email" required autocomplete="username" />
    </label>

    <label>
      Password
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
      />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" class="primary" [disabled]="busy() || form.invalid">
      {{ busy() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="muted">New here? <a routerLink="/register">Set up your business</a></p>

  <div class="demo">
    <p class="muted">Demo accounts (password <code>shiftwise123</code>):</p>
    <button type="button" (click)="useDemo('manager@harbour.test')">Manager</button>
    <button type="button" (click)="useDemo('sam@harbour.test')">Employee</button>
  </div>
</section>
